# Media controls with Super + Volume keys
bindel = $mainMod, xf86audiolowervolume, exec, $scriptsDir/MediaCtrl.sh --prv # previous track
bindel = $mainMod, xf86audioraisevolume, exec, $scriptsDir/MediaCtrl.sh --nxt # next track

# YouTube Music specific play/pause
# bindl = $mainMod, xf86AudioPlay, exec, $scriptsDir/youtube-music-toggle.sh  # DISABLED: script does not exist

# Hibernate (lock is handled by hypridle's before_sleep_cmd)
bindd = CTRL ALT, H, hibernate, exec, systemctl hibernate
